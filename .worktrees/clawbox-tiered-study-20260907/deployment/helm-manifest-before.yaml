            - name: MYSQL_DATABASE
              value: "cube_mvp"
            - name: MYSQL_USER
              value: "cube"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cube-secret
                  key: mysql-password
          args:
            - --skip-name-resolve
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent
            initialDelaySeconds: 10
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          hostPath:
            path: "/data/cubesandbox/mysql"
            type: DirectoryOrCreate
