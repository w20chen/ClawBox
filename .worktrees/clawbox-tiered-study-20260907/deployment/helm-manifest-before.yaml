            path: /lib/modules
        - name: bootstrap-state
          hostPath:
            path: /var/lib/cube-node-bootstrap
            type: DirectoryOrCreate
        - name: data-cubelet
          hostPath:
            path: /data/cubelet
            type: DirectoryOrCreate
        - name: data-log
          hostPath:
            path: /data/log
            type: DirectoryOrCreate
