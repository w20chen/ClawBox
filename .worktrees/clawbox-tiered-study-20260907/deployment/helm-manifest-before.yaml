# Source: cube/templates/webui.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cube-webui-config
  labels:
    helm.sh/chart: "cube-0.7.0"
    app.kubernetes.io/name: cube
    app.kubernetes.io/instance: cube
    app.kubernetes.io/version: "0.7.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: webui
data:
  nginx.conf: |-
    worker_processes auto;
    
    events {
        worker_connections 1024;
    }
    
    http {
        include /usr/local/openresty/nginx/conf/mime.types;
        default_type application/octet-stream;
    
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
    
        gzip on;
        gzip_types text/plain text/css application/javascript application/json application/xml;
    
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      '';
        }
    
        server {
            listen 80;
            server_name _;
    
            root /usr/share/nginx/html;
            index index.html;
    
            location = /cubeapi {
                return 308 /cubeapi/;
            }
            location ^~ /sandbox/ {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_read_timeout 7206s;
                proxy_send_timeout 7206s;
    
                proxy_pass http://cube-proxy.cube-system.svc.cluster.local:80;
            }
    
            location /opsapi/ {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
    
                proxy_pass http://cube-ops.cube-system.svc.cluster.local:3010/api/;
            }
    
            location /cubeapi/v1/ {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
    
                rewrite ^/cubeapi/v1/(.*)$ /api/v1/sdk/$1 break;
                proxy_pass http://cube-ops.cube-system.svc.cluster.local:3010;
            }
    
            location = /health {
                proxy_pass http://cube-ops.cube-system.svc.cluster.local:3010/health;
            }
    
            location ~ ^/(sandboxes|v2/sandboxes|templates|snapshots) {
                if ($http_authorization = "") {
                    return 418;
                }
                add_header Vary "Authorization" always;
                add_header Cache-Control "no-store" always;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
    
                rewrite ^/(.*)$ /api/v1/sdk/$1 break;
                proxy_pass http://cube-ops.cube-system.svc.cluster.local:3010;
            }
    
            error_page 418 = @spa_fallback;
            location @spa_fallback {
                root /usr/share/nginx/html;
                try_files /index.html =404;
                add_header Vary "Authorization" always;
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            }
    
            location /assets/ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
    
            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
