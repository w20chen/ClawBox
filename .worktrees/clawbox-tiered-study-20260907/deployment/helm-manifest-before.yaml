# Source: cube/templates/redis.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cube-redis
  labels:
    helm.sh/chart: "cube-0.7.0"
    app.kubernetes.io/name: cube
    app.kubernetes.io/instance: cube
    app.kubernetes.io/version: "0.7.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: redis
spec:
  serviceName: cube-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cube
      app.kubernetes.io/instance: cube
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube
        app.kubernetes.io/instance: cube
        app.kubernetes.io/component: redis
    spec:
      
      nodeSelector:
        cube.tencent.com/cube-control: "true"
      tolerations:
        - effect: NoSchedule
          key: cube.tencent.com/control
          operator: Equal
          value: "true"
        - effect: NoSchedule
          key: cube.tencent.com/compute
          operator: Equal
          value: "true"
      containers:
        - name: redis
          image: "redis:7-alpine"
          imagePullPolicy: IfNotPresent
          args:
            - /etc/redis/redis.conf
          env:
            
            - name: TZ
              value: "Asia/Shanghai"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cube-secret
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli ping | grep -x PONG
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli ping | grep -x PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli ping | grep -x PONG
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          projected:
            sources:
              - configMap:
                  name: cube-redis
              - secret:
                  name: cube-secret
                  items:
                    - key: redis-auth.conf
                      path: redis-auth.conf
        - name: redis-data
          hostPath:
            path: "/data/cubesandbox/redis"
            type: DirectoryOrCreate

