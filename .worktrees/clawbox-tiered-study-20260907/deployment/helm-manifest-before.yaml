# Source: cube/templates/node-bootstrap-daemonset.yaml
# Node prep DaemonSet (wait-pvm-host + node-init + write node-prep-ready).
# PVM host install is on cube-node-pvm. Low-churn: bumping nodeInit recreates
# THIS pod only, not the Big Pod. Artifact install stays on cube-node-installer.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cube-node-bootstrap
  labels:
    helm.sh/chart: "cube-0.7.0"
    app.kubernetes.io/name: cube
    app.kubernetes.io/instance: cube
    app.kubernetes.io/version: "0.7.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cube-node-bootstrap
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cube
      app.kubernetes.io/instance: cube
      app.kubernetes.io/component: cube-node-bootstrap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube
        app.kubernetes.io/instance: cube
        app.kubernetes.io/component: cube-node-bootstrap
      annotations:
    spec:
      serviceAccountName: cube-node
      automountServiceAccountToken: true
      # nsenter --target 1 for node-init (same privilege model as former Big Pod inits).
      hostPID: true
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
      
      nodeSelector:
        cube.tencent.com/cube-node: "true"
      tolerations:
        - effect: NoSchedule
          key: cube.tencent.com/control
          operator: Equal
          value: "true"
        - effect: NoSchedule
          key: cube.tencent.com/compute
          operator: Equal
          value: "true"
      initContainers:
        - name: invalidate-stale-node-prep
          image: "cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-node-init:v0.7.0"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              . /scripts/node-prep-lib.sh
              ready="$(node_prep_ready_path)"
              [ -f "$ready" ] || exit 0
              old_generation="$(sed -n 's/^prep_generation=//p' "$ready")"
              old_node_init="$(sed -n 's/^node_init_enabled=//p' "$ready")"
              if [ "$old_generation" != "$PREP_GENERATION" ] || [ "$old_node_init" != "$NODE_INIT_ENABLED" ]; then
                invalidate_node_prep_ready
              fi
          env:
            - name: STATE_DIR
              value: "/var/lib/cube-node-bootstrap"
            - name: PREP_GENERATION
              value: "1"
            - name: NODE_INIT_ENABLED
              value: "1"
          volumeMounts:
            - name: bootstrap-state
              mountPath: /var/lib/cube-node-bootstrap
        - name: wait-pvm-host
          image: "cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-node-init:v0.7.0"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/tini", "-s", "--", "/scripts/wait-pvm-host.sh"]
          securityContext:
            privileged: true
          env:
            
            - name: TZ
              value: "Asia/Shanghai"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_ROOT
              value: /host
            - name: STATE_DIR
              value: "/var/lib/cube-node-bootstrap"
            - name: PVM_FEATURE_ENABLED
              value: "0"
            - name: CUBE_PVM_ENABLE
              value: "0"
            - name: ALLOW_PVM_LABEL
              value: cube.tencent.com/allow-pvm-bootstrap
            - name: DESIRED_KERNEL_PATTERN
              value: "pvm.host"
            - name: KERNEL_BOOT_ARGS
              value: "nopti pti=off"
            - name: WAIT_TIMEOUT_SECONDS
              value: "900"
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: bootstrap-state
              mountPath: /var/lib/cube-node-bootstrap
        - name: cube-node-init
          image: "cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-node-init:v0.7.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            
            - name: TZ
              value: "Asia/Shanghai"
            - name: HOST_ROOT
              value: /host
            - name: STATE_DIR
              value: "/var/lib/cube-node-bootstrap"
            - name: NODE_INIT_ENABLED
              value: "1"
            - name: PVM_ENABLED
              value: "0"
            - name: SKIP_IF_NODE_PREP_READY
              value: "true"
            - name: DATA_CUBELET
              value: "/data/cubelet"
            - name: REQUIRE_KVM
              value: "true"
            - name: REQUIRE_XFS
              value: "true"
            - name: CHMOD_KVM
              value: "true"
            - name: LOAD_KVM_MODULE
              value: "true"
            - name: WRITE_UDEV_RULE
              value: "true"
            - name: CREATE_HOST_DIRS
              value: "true"
            - name: CHECK_MASTER_CONNECTIVITY
              value: "true"
            - name: CUBE_MASTER_ENDPOINT
              value: "cube-master.cube-system.svc.cluster.local:8089"
            - name: LOOPBACK_ENABLED
              value: "true"
            - name: LOOPBACK_IMAGE_PATH
              value: "/data/cubelet-xfs.img"
            - name: LOOPBACK_SIZE
              value: "200G"
            - name: CHECK_MEMORY
              value: "true"
            - name: MIN_MEMORY_KB
              value: "7500000"
            - name: CHECK_CGROUP_CPU
              value: "true"
            - name: CHECK_BPF_FS
              value: "true"
            - name: CHECK_GLIBC
              value: "true"
            - name: CHECK_CIDR
              value: "true"
            - name: CHECK_CUBECOW_DEPS
              value: "true"
            - name: CUBE_PVM_ENABLE
              value: "0"
            - name: CUBE_SANDBOX_NETWORK_CIDR
              value: "172.16.0.0/18"
            - name: CUBE_SANDBOX_NETWORK_CIDR_SKIP_CONFLICT_CHECK
              value: "0"
            - name: PREP_GENERATION
              value: "1"
            - name: DESIRED_KERNEL_PATTERN
              value: "pvm.host"
            - name: KERNEL_BOOT_ARGS
              value: "nopti pti=off"
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: bootstrap-state
              mountPath: /var/lib/cube-node-bootstrap
            - name: data-cubelet
              mountPath: /data/cubelet
              mountPropagation: Bidirectional
            - name: data-log
              mountPath: /data/log
            - name: data-cube-shim
              mountPath: /data/cube-shim
              mountPropagation: Bidirectional
            - name: data-snapshot-pack
              mountPath: /data/cubelet/snapshot_pack
            - name: data-cube-shared
              mountPath: /data/cube-shared
              mountPropagation: Bidirectional
            - name: data-shared
              mountPath: /data/shared
              mountPropagation: Bidirectional
            - name: tmp-cube
              mountPath: /tmp/cube
              mountPropagation: Bidirectional
      containers:
        - name: write-node-prep-ready
          image: "cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-wait-node-prep:v0.7.0"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/tini", "-s", "--", "/scripts/write-node-prep-ready.sh"]
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            
            - name: TZ
              value: "Asia/Shanghai"
            - name: STATE_DIR
              value: "/var/lib/cube-node-bootstrap"
            - name: PREP_GENERATION
              value: "1"
            - name: PVM_ENABLED
              value: "0"
            - name: NODE_INIT_ENABLED
              value: "1"
            - name: DESIRED_KERNEL_PATTERN
              value: "pvm.host"
            - name: KERNEL_BOOT_ARGS
              value: "nopti pti=off"
          volumeMounts:
            - name: bootstrap-state
              mountPath: /var/lib/cube-node-bootstrap
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: dev
          hostPath:
            path: /dev
        - name: sys
          hostPath:
            path: /sys
        - name: lib-modules
