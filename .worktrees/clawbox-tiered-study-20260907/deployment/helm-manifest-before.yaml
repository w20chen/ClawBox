        app.kubernetes.io/component: cube-node
      annotations:
        kubectl.kubernetes.io/default-container: cubelet
    spec:
      serviceAccountName: cube-node
      automountServiceAccountToken: true
      hostPID: true
      hostNetwork: false
      terminationGracePeriodSeconds: 30
      # With hostNetwork the Pod shares the host netns; ClusterFirstWithHostNet
      # keeps in-cluster DNS working from the host network namespace.
      dnsPolicy: ClusterFirst
      
      nodeSelector:
        cube.tencent.com/cube-node: "true"
      tolerations:
        - effect: NoSchedule
          key: cube.tencent.com/control
          operator: Equal
          value: "true"
        - effect: NoSchedule
          key: cube.tencent.com/compute
          operator: Equal
          value: "true"
      initContainers:
        # wait-node-prep: block until bootstrap wrote a matching node-prep-ready
        # fingerprint, then exit 0 so run containers can start.
        - name: wait-node-prep
          image: "cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-wait-node-prep:v0.7.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: STATE_DIR
              value: "/var/lib/cube-node-bootstrap"
          volumeMounts:
            - name: bootstrap-state
              mountPath: /var/lib/cube-node-bootstrap
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 20m
              memory: 32Mi
      containers:
        # Artifact install (shim/kernel/guest) lives in cube-node-installer.
        - name: cubelet
          image: "cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cubelet:v0.7.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                - SYS_MODULE
                - SYS_RESOURCE
                - IPC_LOCK
                - SYS_PTRACE
          env:
            
            - name: TZ
              value: "Asia/Shanghai"
            - name: TOOLBOX_ROOT
              value: /usr/local/services/cubetoolbox
            - name: IMAGE_ROOT
              value: /opt/cube-image
            - name: CUBE_PID_DIR
              value: /run/cube-node
            - name: STATE_DIR
              value: "/var/lib/cube-node-bootstrap"
            - name: CUBE_OPS_ENDPOINT
              value: "cube-ops.cube-system.svc.cluster.local:3010"
            - name: CUBE_MASTER_HTTP_ADDR
              value: "cube-master.cube-system.svc.cluster.local:8089"
            - name: CUBE_SANDBOX_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CUBE_SANDBOX_ENDPOINT_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CUBE_PVM_ENABLE
              value: "0"
            - name: CUBE_SANDBOX_AUTO_DETECT_ETH
              value: "true"
            - name: CUBE_SANDBOX_ETH_NAME
              value: ""
            - name: CUBE_SANDBOX_NETWORK_CIDR
              value: "172.16.0.0/18"
            - name: CUBE_EGRESS_ADMIN_PORT
              value: "9091"
            - name: CUBE_SANDBOX_DNS_SERVERS
              value: ""
            - name: CUBE_SANDBOX_DNS_FOLLOW_NODE
              value: "true"
            - name: CUBE_COMPONENT
              value: cubelet
            - name: CUBE_ROLE
              value: run
          ports:
            - name: cubelet-grpc
              containerPort: 9999
            - name: cubelet-http
              containerPort: 9998
            - name: cubelet-debug
              containerPort: 9966
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    # Kill only this container's pidfile. Never pkill -f —
                    # must not match containerd-shim-cube-rs / cube-runtime / VMM.
                    pidfile=/run/cube-node/cubelet.pid
                    if [[ -f "${pidfile}" ]]; then
