spec:
  template:
    spec:
      containers:
        - name: cubelet
          command: ["/bin/bash", "-lc"]
          args:
            - >-
              ip neigh replace 169.254.1.1 lladdr ee:ee:ee:ee:ee:ee dev eth0 nud permanent;
              sed -i 's/seq 1 60/seq 1 300/' /usr/local/bin/component-entrypoint.sh;
              exec /usr/local/bin/component-entrypoint.sh
