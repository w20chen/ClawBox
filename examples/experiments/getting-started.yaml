schema_version: 2
experiment_id: marker-example
workload:
  source: recorded_trace
  input: examples/traces/smoke.jsonl
  repetitions: 1
  cases:
    - case_id: marker
      source: recorded_trace
      source_reference: examples/traces/smoke.jsonl
      replay_trace_reference: examples/traces/smoke.jsonl
      prompt: Create /workspace/result.txt containing complete.
agent: {driver: replay_engine}
inference: {backend: replay, configuration: {time_scale: 1.0}}
# Replace these aliases with templates registered on your ARM64 Linux host.
runtime: {template_alias: runtime-example-arm64, vcpu: 2, memory_mib: 2048}
sandbox: {template_alias: tool-example-arm64, vcpu: 2, memory_mib: 4096, workspace: /workspace}
execution:
  concurrency_levels: [1]
  random_seed: 0
  arm_timeout_seconds: 300
  command_timeout_seconds: 60
resources:
  target_node: replace-with-your-cubesandbox-node
  pool_memory_budget_mib: 16384
  emergency_free_memory_mib: 1024
  checkpoint_restore_headroom_mib: 1024
  static_tool_memory_mib: 256
  p90_predictions: examples/predictions/smoke-p90.json
policies:
  - {name: tool-static-resident, admission: tool_static, reclamation: resident, eviction: none, restore: none}
validation: {command: "test \"$(cat /workspace/result.txt)\" = complete"}
output: {directory: /results}
