schema_version: 2
experiment_id: openclaw-cube
workload:
  source: recorded_trace
  input: examples/traces/smoke.jsonl
  repetitions: 1
  cases:
    - case_id: openclaw-cube-smoke
      source: recorded_trace
      source_reference: examples/traces/smoke.jsonl
      prompt: >-
        Use cube_shell to create /workspace/result.txt containing exactly
        openclaw-cube-ok followed by a newline, then verify the file.
agent: {driver: openclaw}
inference:
  backend: api
  configuration:
    base_url: https://api.openai.com/v1
    model: gpt-5-mini
    api_key_env: OPENCLAW_API_KEY
    repo_fingerprint: local/openclaw-cube-smoke
runtime:
  template_id: tpl-743b4bf146c642328ebe4e70
  source_image_reference: 193.124.7.2:5001/clawbox/runtime-cube-arm64
  image_digest: sha256:02ae0ff35f57352c615746f17734fcc425d9fac5cffa8b9d075416c5ad91523e
  architecture: arm64
  vcpu: 2
  memory_mib: 2048
  workspace: /workspace
sandbox:
  template_id: tpl-69e6945ec7844b26976bf4b7
  source_image_reference: 193.124.7.2:5001/clawbox/tool-cube-arm64
  image_digest: sha256:efe9a11299398c6755188e3e3a1b0c9c6067f17408e70cf39c5872284bc754a2
  architecture: arm64
  vcpu: 2
  memory_mib: 4096
  workspace: /workspace
execution:
  concurrency_levels: [1]
  randomized_order: false
  arm_timeout_seconds: 600
  command_timeout_seconds: 60
  stabilization_seconds: 1
resources:
  target_node: hostname-txyuq.foreman.pxe
  pool_memory_budget_mib: 1600000
  emergency_free_memory_mib: 200000
  checkpoint_restore_headroom_mib: 8192
  static_tool_memory_mib: 256
policies:
  - {name: openclaw-eager, admission: tool_static, reclamation: snapshot_pause, eviction: eager, restore: reactive}
validation: {command: "test \"$(cat /workspace/result.txt)\" = openclaw-cube-ok"}
output: {directory: /results}
