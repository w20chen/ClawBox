schema_version: 2
experiment_id: cube-smoke-matrix
workload: {source: recorded_trace, input: examples/traces/smoke.jsonl, repetitions: 1}
agent: {driver: replay_engine}
inference: {backend: replay, configuration: {time_scale: 0.1}}
runtime: {template_alias: clawbox-runtime-arm64-2g-v3, vcpu: 1, memory_mib: 2048}
sandbox:
  template_id: tpl-c7212cdc724844639aa65486
  source_image_reference: cube-sandbox-cn.tencentcloudcr.com/cube-sandbox/sandbox-code
