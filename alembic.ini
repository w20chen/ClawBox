# Alembic configuration for the ClawBox managed control plane (ADR-010).
# The URL is resolved in env.py from DATABASE_URL (or defaults to SQLite for
# local dev). Production must set DATABASE_URL to PostgreSQL.
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally NOT set here; env.py reads DATABASE_URL.
# file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
