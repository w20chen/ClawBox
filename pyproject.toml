[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawbox-control-plane"
version = "0.1.0"
description = "CubeSandbox experiment platform with ClawTune measurement and prediction"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn>=0.27",
  "docker>=7.0",
  "cryptography>=42",
  "numpy>=1.26",
  "psutil>=5.9",
  "prometheus-client>=0.20",
  "typing-extensions>=4.12",
  "alembic>=1.13",
  "cubesandbox==0.7.0",
  # cubesandbox 0.7.0 imports e2b.envd.process for its command transport but
  # does not declare the package dependency itself.
  "e2b==2.29.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
images = ["datasets>=3.0"]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
clawbox-cell-controller = "clawbox.cell.app:main"
clawbox-managed-api = "clawbox.api.main:main"
clawbox-managed-dispatcher = "clawbox.api.dispatcher_main:main"
clawbox = "clawbox.cli:main"
clawbox-p90-export = "clawbox.cell.p90:export_main"
clawbox-experiment-worker = "clawbox.experiments.worker:main"
clawbox-tune-server = "clawbox.tuning.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
