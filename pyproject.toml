[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawbox-control-plane"
version = "0.1.0"
description = "Multi-tenant ClawTune control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn>=0.27",
  "docker>=7.0",
  "kubernetes>=30,<35",
  "numpy>=1.26",
  "psutil>=5.9",
  "prometheus-client>=0.20",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
clawbox-scheduler = "clawbox.scheduler.app:main"
clawbox-allocator = "clawbox.allocator.app:main"
clawbox-controller = "clawbox.controller.app:main"
clawbox-node-agent = "clawbox.node_agent.app:main"
clawbox-tool-agent = "clawbox.tool_agent.app:main"
clawbox-swe-rebench = "clawbox.benchmark.kubernetes:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
