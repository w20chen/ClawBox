[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawbox-control-plane"
version = "0.1.0"
description = "CubeSandbox experiment platform with ClawTune measurement and prediction"
requires-python = ">=3.12"
dependencies = [
  "clawtune-sidecar @ git+https://github.com/w20chen/ClawTune.git@1b119259c06ac95cead9e5edd5e062ff57499343#subdirectory=services/sidecar",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn>=0.27",
  "uvloop>=0.23; sys_platform == 'linux'",
  "docker>=7.0",
  "cryptography>=42",
  "numpy>=1.26",
  "psutil>=5.9",
  "prometheus-client>=0.20",
  "typing-extensions>=4.12",
  "cubesandbox==0.7.0",
  # cubesandbox 0.7.0 imports e2b.envd.process for its command transport but
  # does not declare the package dependency itself.
  "e2b==2.29.5",
  "PyYAML>=6.0",
  "jsonschema>=4",
  "jsonschema-rs==0.63.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
images = ["datasets>=3.0", "pyarrow>=15", "requests[socks]>=2.32"]
dev = ["pytest>=8", "httpx2", "pyarrow>=15"]

[project.scripts]
clawbox = "clawbox.cli:main"
clawbox-p90-export = "clawbox.tuning.p90_export:export_main"
clawbox-serving-sim = "clawbox.integrations.serving_sim:main"
clawbox-tune-server = "clawbox.tuning.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawbox*"]

[tool.setuptools.package-data]
"clawbox.integrations" = ["serving_sim_requirements_aarch64.lock"]
"clawbox.experiments.knowledge" = ["contracts/*.schema.json", "LICENSE", "PROVENANCE.md"]
"clawbox.experiments.vendor.agentcgroup" = ["LICENSE", "PROVENANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
