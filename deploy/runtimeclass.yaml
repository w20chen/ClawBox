# Example RuntimeClass for the conservative arm64/openEuler baseline. Prefer
# the RuntimeClasses installed by kata-deploy; applying this object does not
# install a runtime handler or guest assets.
#
# IMPORTANT: the `handler` name MUST match the runtime handler configured in
# containerd on the host (e.g. /etc/containerd/config.toml:
#   [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.kata-qemu]
#     runtime_type = "io.containerd.kata.v2"
#     [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.kata-qemu.options]
#       ConfigPath = "/etc/kata-containers/configuration-qemu.toml"
# )
# If the handler does not match, Pods fall back to / fail with runc, which
# silently breaks the microVM isolation this deployment relies on.
#
# ClawBox scripts only verify an existing RuntimeClass and never apply this
# automatically. Use kata-fc explicitly after its separate arm64 gate passes.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu
handler: kata-qemu
