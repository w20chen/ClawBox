apiVersion: v1
kind: Secret
metadata:
  name: clawbox-control-plane
  namespace: clawbox-system
type: Opaque
stringData:
  database-url: postgresql+psycopg://clawbox:replace-me@postgres.example.internal/clawbox
  service-token: replace-with-at-least-32-random-bytes
  ingest-secret: replace-with-at-least-32-independent-random-bytes
