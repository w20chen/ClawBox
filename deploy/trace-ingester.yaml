apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawbox-ingester
  namespace: clawbox-system
  labels: &labels
    app.kubernetes.io/name: clawbox
    app.kubernetes.io/component: trace-ingester
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      # Single-node test cluster: tolerate the control-plane + disk-pressure
      # taints (kubelet re-adds disk-pressure under load) so the ingester can
      # schedule/keep running.
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/disk-pressure, operator: Exists, effect: NoSchedule}
      initContainers:
        - name: prepare-data
          image: 127.0.0.1:5000/clawbox/control-plane-arm64:fixed2
          imagePullPolicy: Always
          command: ["chown", "10001:10001", "/data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"], add: ["CHOWN"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: ingester
          image: 127.0.0.1:5000/clawbox/control-plane-arm64:dev
          imagePullPolicy: Always
          command: ["clawbox-trace-ingester"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: clawbox-control-plane, key: database-url}}
            - name: CLAWBOX_INGEST_SECRET
              valueFrom: {secretKeyRef: {name: clawbox-control-plane, key: ingest-secret}}
            - name: CLAWBOX_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: clawbox-control-plane, key: service-token}}
          ports: [{name: http, containerPort: 8084}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          hostPath: {path: /var/lib/clawbox/ingester, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: clawbox-ingester
  namespace: clawbox-system
  labels:
    app.kubernetes.io/name: clawbox
    app.kubernetes.io/component: trace-ingester
spec:
  selector:
    app.kubernetes.io/name: clawbox
    app.kubernetes.io/component: trace-ingester
  ports: [{name: http, port: 8084, targetPort: http}]
