# Managed API + Dispatcher deployment (M1).
#
# Requires (before apply):
#   - deploy/managed-rbac.yaml (ServiceAccounts clawbox-managed-api /
#     clawbox-managed-dispatcher)
#   - a Secret `clawbox-managed` in clawbox-system with:
#       database-url    PostgreSQL URL (psycopg), production schema via alembic
#       service-token   >=32 random bytes shared with API clients
#       templates       JSON TemplateRegistry (optional; else built-in default)
#   - run `alembic upgrade head` (or the API entry-point bootstrap) before
#     serving traffic; the DB is authoritative (restart-safe).
#
# The Managed API has no Kubernetes RBAC by design (pure DB service); only the
# Dispatcher can create SandboxTask CRs.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawbox-managed-api
  namespace: clawbox-system
  labels:
    app: clawbox-managed-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clawbox-managed-api
  template:
    metadata:
      labels:
        app: clawbox-managed-api
    spec:
      serviceAccountName: clawbox-managed-api
      containers:
        - name: api
          image: 127.0.0.1:5000/clawbox/control-plane-arm64:dev
          imagePullPolicy: IfNotPresent
          command: ["clawbox-managed-api"]
          ports:
            - containerPort: 8085
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clawbox-managed
                  key: database-url
            - name: CLAWBOX_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clawbox-managed
                  key: service-token
            - name: CLAWBOX_TEMPLATES
              valueFrom:
                secretKeyRef:
                  name: clawbox-managed
                  key: templates
                  optional: true
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: clawbox-managed-api
  namespace: clawbox-system
spec:
  selector:
    app: clawbox-managed-api
  ports:
    - port: 8085
      targetPort: 8085
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawbox-managed-dispatcher
  namespace: clawbox-system
  labels:
    app: clawbox-managed-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawbox-managed-dispatcher
  template:
    metadata:
      labels:
        app: clawbox-managed-dispatcher
    spec:
      serviceAccountName: clawbox-managed-dispatcher
      containers:
        - name: dispatcher
          image: 127.0.0.1:5000/clawbox/control-plane-arm64:dev
          imagePullPolicy: IfNotPresent
          command: ["clawbox-managed-dispatcher"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clawbox-managed
                  key: database-url
            - name: CLAWBOX_TEMPLATES
              valueFrom:
                secretKeyRef:
                  name: clawbox-managed
                  key: templates
                  optional: true
            - name: CLAWBOX_CELL_NAMESPACE
              value: clawbox-benchmarks
            - name: CLAWBOX_CR_VERSION
              value: v1alpha1
            - name: DISPATCHER_INTERVAL_SECONDS
              value: "2"
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
