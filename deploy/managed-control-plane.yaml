# Managed API + Dispatcher deployment (M1).
#
# Requires (before apply):
#   - deploy/managed-rbac.yaml (ServiceAccounts clawbox-managed-api /
#     clawbox-managed-dispatcher)
#   - a Secret `clawbox-managed` in clawbox-system with:
#       database-url    PostgreSQL (psycopg) or single-node SQLite URL;
#                       production schema is managed with Alembic
#       service-token   >=32 random bytes shared with API clients
#   - run `alembic upgrade head` before serving traffic; the DB is
#     authoritative (restart-safe).
#
# The Managed API has no Kubernetes RBAC by design (pure DB service); only the
# Dispatcher can create SandboxTask CRs.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawbox-managed-api
  namespace: clawbox-system
  labels:
    app: clawbox-managed-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawbox-managed-api
  template:
    metadata:
      labels:
        app: clawbox-managed-api
    spec:
      serviceAccountName: clawbox-managed-api
      initContainers:
        - name: prepare-data
          image: 127.0.0.1:5000/clawbox/control-plane-arm64:fixed2
          command: ["chown", "10001:10001", "/data"]
          securityContext: {runAsUser: 0, runAsGroup: 0}
          volumeMounts: [{name: managed-data, mountPath: /data}]
      containers:
        - name: api
          image: 127.0.0.1:5000/clawbox/control-plane-arm64:dev
          imagePullPolicy: IfNotPresent
          command: ["clawbox-managed-api"]
          ports:
            - containerPort: 8085
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clawbox-managed
                  key: database-url
            - name: CLAWBOX_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clawbox-managed
                  key: service-token
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "1Gi"}
          volumeMounts: [{name: managed-data, mountPath: /data}]
      volumes:
        - name: managed-data
          hostPath: {path: /var/lib/clawbox/managed, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: clawbox-managed-api
  namespace: clawbox-system
spec:
  selector:
    app: clawbox-managed-api
  ports:
    - port: 8085
      targetPort: 8085
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawbox-managed-dispatcher
  namespace: clawbox-system
  labels:
    app: clawbox-managed-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawbox-managed-dispatcher
  template:
    metadata:
      labels:
        app: clawbox-managed-dispatcher
    spec:
      serviceAccountName: clawbox-managed-dispatcher
      initContainers:
        - name: prepare-data
          image: 127.0.0.1:5000/clawbox/control-plane-arm64:fixed2
          command: ["chown", "10001:10001", "/data"]
          securityContext: {runAsUser: 0, runAsGroup: 0}
          volumeMounts: [{name: managed-data, mountPath: /data}]
      containers:
        - name: dispatcher
          image: 127.0.0.1:5000/clawbox/control-plane-arm64:dev
          imagePullPolicy: IfNotPresent
          command: ["clawbox-managed-dispatcher"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clawbox-managed
                  key: database-url
            - name: CLAWBOX_CELL_NAMESPACE
              value: clawbox-benchmarks
            - name: CLAWBOX_WORKER_IMAGE
              value: 127.0.0.1:5000/clawbox/experiment-worker-arm64:dev
            - name: CUBE_API_URL
              value: http://cube-api.cube-system.svc:3000
            - name: CLAWBOX_RESULT_HOST_ROOT
              value: /data/clawbox-results
            - name: DISPATCHER_INTERVAL_SECONDS
              value: "2"
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          volumeMounts: [{name: managed-data, mountPath: /data}]
      volumes:
        - name: managed-data
          hostPath: {path: /var/lib/clawbox/managed, type: DirectoryOrCreate}
