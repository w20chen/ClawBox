apiVersion: v1
kind: Namespace
metadata: {name: clawbox-system}
---
apiVersion: v1
kind: Namespace
metadata: {name: clawbox-benchmarks}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: clawbox-cell-controller, namespace: clawbox-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: clawbox-experiment-worker, namespace: clawbox-benchmarks}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: clawbox-cell-controller, namespace: clawbox-benchmarks}
rules:
  - apiGroups: ["clawbox.openai.com"]
    resources: ["sandboxtasks"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["clawbox.openai.com"]
    resources: ["sandboxtasks/status", "sandboxtasks/finalizers"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: clawbox-cell-controller, namespace: clawbox-benchmarks}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clawbox-cell-controller
subjects:
  - {kind: ServiceAccount, name: clawbox-cell-controller, namespace: clawbox-system}
