apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxtasks.clawbox.openai.com
spec:
  group: clawbox.openai.com
  scope: Namespaced
  names:
    plural: sandboxtasks
    singular: sandboxtask
    kind: SandboxTask
    shortNames: [sbt]
  versions:
    - name: v1alpha2
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Job, type: string, jsonPath: .status.jobName}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [runRef, idempotencyKey, requestDigest, desiredState, workerImage,
                         cubeApiURL, resultHostPath, experimentSpec]
              x-kubernetes-validations:
                - rule: "self == oldSelf || (oldSelf.desiredState == 'Running' && self.desiredState == 'Cancelled' && self.runRef == oldSelf.runRef && self.idempotencyKey == oldSelf.idempotencyKey && self.requestDigest == oldSelf.requestDigest && self.workerImage == oldSelf.workerImage && self.cubeApiURL == oldSelf.cubeApiURL && self.credentialSecretName == oldSelf.credentialSecretName && self.resultHostPath == oldSelf.resultHostPath && self.timeoutSeconds == oldSelf.timeoutSeconds && self.experimentSpec == oldSelf.experimentSpec)"
                  message: "spec is immutable except Running to Cancelled"
              properties:
                runRef:
                  type: object
                  required: [tenantID, runID, attemptID]
                  properties:
                    tenantID: {type: string, minLength: 1, maxLength: 128}
                    runID: {type: string, minLength: 1, maxLength: 128}
                    attemptID: {type: string, minLength: 1, maxLength: 128}
                idempotencyKey: {type: string, minLength: 1, maxLength: 512}
                requestDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
                desiredState: {type: string, enum: [Running, Cancelled], default: Running}
                workerImage: {type: string, pattern: '^.+@sha256:[a-f0-9]{64}$'}
                cubeApiURL: {type: string, minLength: 1}
                credentialSecretName: {type: string, minLength: 1, maxLength: 253}
                resultHostPath: {type: string, pattern: '^/'}
                timeoutSeconds: {type: integer, minimum: 60, maximum: 86400, default: 21600}
                experimentSpec:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase: {type: string, enum: [pending, running, succeeded, failed, cancelled, cleaned]}
                jobName: {type: string}
                resolvedSpecDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
                errorCategory: {type: string}
                resultRef: {type: string}
