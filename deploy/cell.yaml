apiVersion: clawbox.openai.com/v1alpha1
kind: SandboxTask
metadata:
  name: $TASK_NAME
  namespace: $NAMESPACE
  labels:
    app.kubernetes.io/name: clawbox-cell
    app.kubernetes.io/managed-by: clawbox-cell-cli
spec:
  toolImage: $TOOL_IMAGE
  problemStatement: $PROBLEM_STATEMENT
  baseCommit: $BASE_COMMIT
  hintText: $HINT_TEXT
  llmSecretName: $LLM_SECRET_NAME
  llmEgressCIDR: $LLM_EGRESS_CIDR
  llmEgressPort: $LLM_EGRESS_PORT
  toolEgressCIDRs: $TOOL_EGRESS_CIDRS
  profile: $RESOURCE_PROFILE
  timeoutSeconds: $TASK_TIMEOUT_SECONDS
  commandTimeoutSeconds: $TOOL_EXEC_TIMEOUT_SECONDS
  outputLimitBytes: $TOOL_OUTPUT_LIMIT_BYTES
