apiVersion: v1
kind: Pod
metadata:
  name: clawbox-high-density-replay
  namespace: clawbox-system
spec:
  # Replace with the single NUMA host selected for the experiment.
  nodeSelector:
    kubernetes.io/hostname: kunpeng-node
  restartPolicy: Never
  containers:
    - name: runner
      image: 127.0.0.1:5000/clawbox/swe-rebench-arm64:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep infinity"]
      securityContext:
        # Required by this paper prototype for the KVM device cgroup. It has no
        # host namespaces and only the explicit paths below are mounted.
        privileged: true
        runAsUser: 0
      resources:
        requests: {cpu: "1", memory: 256Mi}
        limits: {cpu: "80", memory: 64Gi}
      env:
        - {name: PYTHONPATH, value: /experiment/src}
      volumeMounts:
        - {name: kvm, mountPath: /dev/kvm}
        - {name: firecracker, mountPath: /opt/kata/bin/firecracker, readOnly: true}
        - {name: kata-assets, mountPath: /opt/kata/share/kata-containers, readOnly: true}
        - {name: experiment, mountPath: /experiment}
  volumes:
    - {name: kvm, hostPath: {path: /dev/kvm, type: CharDevice}}
    - {name: firecracker, hostPath: {path: /opt/kata/bin/firecracker, type: File}}
    - {name: kata-assets, hostPath: {path: /opt/kata/share/kata-containers, type: Directory}}
    - name: experiment
      hostPath:
        # Use a dedicated, non-shared experiment directory on the selected host.
        path: /var/lib/clawbox-high-density-replay
        type: Directory
