# SandboxTask CRD — v1alpha2 draft (ADR-003, M1-2).
#
# Changes vs v1alpha1:
#   - spec.runRef.{tenantID,runID,attemptID}: server-generated identity link
#     from the Managed API (ADR-002); the task name stays display-only.
#   - spec.idempotencyKey / spec.requestDigest: immutable idempotency match
#     (ADR-002).
#   - spec.desiredState: the ONLY mutable spec field; one-way Running ->
#     Cancelled (CEL-validated). Execution fields remain immutable.
#   - status.conditions: explicit Condition list (list-map on type) in
#     addition to the legacy phase/outcome fields.
#
# Deployment note (do NOT apply before these are true):
#   1. The conversion webhook (deploy/conversion-webhook.yaml) is deployed and
#      serving — v1alpha1 is kept served (deprecated) through a webhook
#      conversion to v1alpha2.
#   2. The Cell Controller reads v1alpha2 (VERSION_V1ALPHA2 constant) and the
#      Managed API writes v1alpha2.
#   Until then the live cluster keeps deploy/sandboxtask-crd.yaml (v1alpha1).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxtasks.clawbox.openai.com
spec:
  group: clawbox.openai.com
  scope: Namespaced
  names:
    plural: sandboxtasks
    singular: sandboxtask
    kind: SandboxTask
    shortNames: [sbt]
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1", "v1beta1"]
      clientConfig:
        service:
          namespace: clawbox-system
          name: clawbox-conversion
          path: /convert
          port: 8443
  versions:
    - name: v1alpha2
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Outcome
          type: string
          jsonPath: .status.outcome
        - name: Attempt
          type: string
          jsonPath: .spec.runRef.attemptID
        - name: Desired
          type: string
          jsonPath: .spec.desiredState
        - name: Profile
          type: string
          jsonPath: .spec.profile
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: "self.metadata.name.size() <= 48"
              message: "SandboxTask names are limited to 48 characters for owned child names"
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                # Immutable execution contract; the only permitted mutation is
                # the one-way cancellation of desiredState (ADR-003).
                - rule: "self == oldSelf || (oldSelf.desiredState == 'Running' && self.desiredState == 'Cancelled')"
                  message: "SandboxTask spec is immutable except one-way cancellation via spec.desiredState (Running -> Cancelled); create a new task for a retry"
              required:
                [toolImage, problemStatement, llmSecretName, llmEgressCIDR, runRef, idempotencyKey, requestDigest]
              properties:
                runRef:
                  type: object
                  required: [tenantID, runID, attemptID]
                  properties:
                    tenantID: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$'}
                    runID: {type: string, minLength: 26, maxLength: 128}
                    attemptID: {type: string, minLength: 26, maxLength: 128}
                idempotencyKey: {type: string, minLength: 1, maxLength: 512}
                requestDigest:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                desiredState:
                  type: string
                  enum: [Running, Cancelled]
                  default: Running
                toolImage:
                  type: string
                  pattern: '^.+@sha256:[a-f0-9]{64}$'
                  description: Immutable, contract-tested linux/arm64 SWE-ReBench image.
                problemStatement: {type: string, minLength: 1, maxLength: 1000000}
                baseCommit: {type: string, maxLength: 256}
                hintText: {type: string, maxLength: 1000000}
                llmSecretName: {type: string, minLength: 1, maxLength: 253}
                llmEgressCIDR: {type: string, minLength: 3, maxLength: 64}
                llmEgressPort: {type: integer, minimum: 1, maximum: 65535, default: 443}
                toolEgressCIDRs:
                  type: array
                  maxItems: 32
                  items: {type: string, minLength: 3, maxLength: 64}
                profile: {type: string, enum: [small, medium, large], default: small}
                timeoutSeconds: {type: integer, minimum: 60, maximum: 21600, default: 1800}
                commandTimeoutSeconds: {type: integer, minimum: 1, maximum: 3600, default: 300}
                outputLimitBytes: {type: integer, minimum: 1024, maximum: 33554432, default: 4194304}
            status:
              type: object
              properties:
                phase: {type: string}
                outcome: {type: string}
                observedGeneration: {type: integer}
                lastTransitionTime: {type: string, format: date-time}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string, maxLength: 316}
                      status: {type: string, enum: [True, False, Unknown]}
                      reason: {type: string, maxLength: 1024}
                      message: {type: string, maxLength: 32768}
                      observedGeneration: {type: integer}
                      lastTransitionTime: {type: string, format: date-time}
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      deprecationWarning: "clawbox.openai.com/v1alpha1 SandboxTask is deprecated; use v1alpha2 (runRef/desiredState)."
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Outcome
          type: string
          jsonPath: .status.outcome
        - name: Profile
          type: string
          jsonPath: .spec.profile
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "SandboxTask spec is immutable; create a new task for a retry"
              required: [toolImage, problemStatement, llmSecretName, llmEgressCIDR]
              properties:
                toolImage:
                  type: string
                  pattern: '^.+@sha256:[a-f0-9]{64}$'
                problemStatement: {type: string, minLength: 1, maxLength: 1000000}
                baseCommit: {type: string, maxLength: 256}
                hintText: {type: string, maxLength: 1000000}
                llmSecretName: {type: string, minLength: 1, maxLength: 253}
                llmEgressCIDR: {type: string, minLength: 3, maxLength: 64}
                llmEgressPort: {type: integer, minimum: 1, maximum: 65535, default: 443}
                toolEgressCIDRs:
                  type: array
                  maxItems: 32
                  items: {type: string, minLength: 3, maxLength: 64}
                profile: {type: string, enum: [small, medium, large], default: small}
                timeoutSeconds: {type: integer, minimum: 60, maximum: 21600, default: 1800}
                commandTimeoutSeconds: {type: integer, minimum: 1, maximum: 3600, default: 300}
                outputLimitBytes: {type: integer, minimum: 1024, maximum: 33554432, default: 4194304}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
