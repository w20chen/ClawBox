# Indexed Job: one Pod == one temporary user == one Firecracker microVM.
#
# This file is rendered by run.sh with envsubst. The variables that are
# substituted come from the environment:
#   $JOB_NAME        Job name (default claw-runner)
#   $IMAGE           runner image reference (e.g. registry.local/openclaw-runner:latest)
#   $PARALLELISM     number of Pods to run at once
#   $COMPLETIONS     total number of tenants (Indexed completions)
#   $OPENCLAW_MODEL  model id OpenClaw should use (exposed by the sidecar proxy)
#   $OPENCLAW_TIMEOUT  per-run timeout in seconds for `openclaw agent --local`
#
# Secrets (base URL, API key, task message) come from the `claw-llm` Secret
# created by run.sh, so no credentials are hard-coded here.
#
# There is intentionally NO `kubectl`/envsubst default inside the file: run.sh
# exports every variable above before rendering.
apiVersion: batch/v1
kind: Job
metadata:
  name: $JOB_NAME
  labels:
    app: openclaw-runner
spec:
  completionMode: Indexed
  completions: $COMPLETIONS
  parallelism: $PARALLELISM
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: openclaw-runner
    spec:
      restartPolicy: Never
      runtimeClassName: kata-fc
      containers:
        - name: runner
          image: $IMAGE
          imagePullPolicy: IfNotPresent
          env:
            # One tenant per Pod, taken from the Indexed Job's completion
            # index annotation (0, 1, 2, ...).
            - name: TENANT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: TASK_MESSAGE
              valueFrom:
                secretKeyRef:
                  name: claw-llm
                  key: task-message
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: claw-llm
                  key: openai-base-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claw-llm
                  key: openai-api-key
            - name: OPENCLAW_MODEL
              value: $OPENCLAW_MODEL
            - name: SIDECAR_PORT
              value: "8765"
            - name: OPENCLAW_TIMEOUT
              value: $OPENCLAW_TIMEOUT
          # Fixed resources for the first version. No dynamic sizing.
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        # Ephemeral per-Pod state: /state/<tenant_id>/kb.sqlite + traces.
        # Destroyed with the Pod, matching the "temporary user" model.
        - name: state
          emptyDir: {}
