# Example Secret for the runner Job. Placeholder values only — never commit a
# real key. run.sh creates this Secret automatically from environment
# variables, so you normally do not apply this file yourself.
#
#   kubectl apply -f deploy/kata-firecracker/secret.example.yaml
#
# Keys used by the Job:
#   openai-base-url  external OpenAI-compatible LLM base URL (all tenants share it)
#   openai-api-key   external LLM API key (all tenants share it)
#   task-message     one-shot task prompt given to every tenant
apiVersion: v1
kind: Secret
metadata:
  name: claw-llm
type: Opaque
stringData:
  openai-base-url: "http://<llm-host>:8000/v1"
  openai-api-key: "<replace-with-real-key>"
  task-message: "Use the shell to print claw-cloud-ok"
