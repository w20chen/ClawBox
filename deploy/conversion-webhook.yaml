# Conversion webhook stub for SandboxTask v1alpha1 <-> v1alpha2 (ADR-003).
#
# The controller container runs the same control-plane image; the conversion
# handler is implemented in the Managed API server (M1-4, endpoint /convert)
# and registered in the ConversionWebhookConfiguration below.
#
# Steps to activate (after M1-4 handler + certs exist):
#   1. kubectl apply -f deploy/control-plane-rbac.yaml   # conversion permissions
#   2. Create TLS cert/key for clawbox-conversion.clawbox-system.svc
#      (mount into the deployment; see control-plane-secret.example.yaml).
#   3. kubectl apply -f deploy/conversion-webhook.yaml
#   4. kubectl apply -f deploy/sandboxtask-crd-v1alpha2.yaml
#   5. Flip the Cell Controller / Managed API to VERSION_V1ALPHA2 and verify a
#      no-op conversion round trip on live objects before relying on it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawbox-conversion
  namespace: clawbox-system
  labels:
    app: clawbox-conversion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clawbox-conversion
  template:
    metadata:
      labels:
        app: clawbox-conversion
    spec:
      serviceAccountName: clawbox-control-plane
      containers:
        - name: conversion
          image: 127.0.0.1:5000/clawbox/control-plane-arm64:dev
          imagePullPolicy: IfNotPresent
          command: ["clawbox-conversion-webhook"]
          args: ["--tls-cert-file", "/etc/clawbox-conversion/tls.crt", "--tls-key-file", "/etc/clawbox-conversion/tls.key"]
          ports:
            - containerPort: 8443
              name: https
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
          volumeMounts:
            - name: tls
              mountPath: /etc/clawbox-conversion
              readOnly: true
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: tls
          secret:
            secretName: clawbox-conversion-tls
---
apiVersion: v1
kind: Service
metadata:
  name: clawbox-conversion
  namespace: clawbox-system
spec:
  selector:
    app: clawbox-conversion
  ports:
    - port: 443
      targetPort: 8443
      name: https
---
# Uncomment once the TLS secret exists:
# apiVersion: apiextensions.k8s.io/v1
# kind: ConversionReview
# (ConversionWebhookConfiguration is declared inline on the CRD's
#  conversion.webhook.clientConfig.service, so no separate object is needed.)
