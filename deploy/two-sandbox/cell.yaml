apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-$TENANT_ID-tool
  labels: &toolLabels
    app.kubernetes.io/name: claw-two-sandbox
    app.kubernetes.io/component: tool
    app.kubernetes.io/managed-by: claw-two-sandbox
    claw.openai.com/tenant-id: $TENANT_ID
    claw.openai.com/runtime-id: $RUNTIME_ID
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claw-two-sandbox
      app.kubernetes.io/component: tool
      claw.openai.com/tenant-id: $TENANT_ID
  template:
    metadata:
      labels: *toolLabels
    spec:
      automountServiceAccountToken: false
      $TOOL_RUNTIME_CLASS_LINE
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tool
          image: $TOOL_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: TENANT_ID
              value: $TENANT_ID
            - name: RUNTIME_ID
              value: $RUNTIME_ID
            - name: TOOL_EXEC_TIMEOUT_SECONDS
              value: "$TOOL_EXEC_TIMEOUT_SECONDS"
            - name: TOOL_PIDS_LIMIT
              value: "$TOOL_PIDS_LIMIT"
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - test -s /var/run/secrets/tool-ssh/ssh_host_ed25519_key.pub && test -s /home/executor/.ssh/authorized_keys && test -s /run/tool-sshd/sshd.pid && kill -0 "$(cat /run/tool-sshd/sshd.pid)"
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          resources:
            requests:
              cpu: "$TOOL_CPU_REQUEST"
              memory: "$TOOL_MEMORY_REQUEST"
              ephemeral-storage: "$TOOL_STORAGE_REQUEST"
            limits:
              cpu: "$TOOL_CPU_LIMIT"
              memory: "$TOOL_MEMORY_LIMIT"
              ephemeral-storage: "$TOOL_STORAGE_LIMIT"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run/tool-sshd
            - name: home
              mountPath: /home/executor
            - name: ssh-public-key
              mountPath: /var/run/secrets/tool-ssh
              readOnly: true
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: "$TOOL_STORAGE_LIMIT"
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: home
          emptyDir:
            sizeLimit: 16Mi
        - name: ssh-public-key
          secret:
            secretName: $SSH_SECRET_NAME
            defaultMode: 0440
            items:
              - key: id_ed25519.pub
                path: id_ed25519.pub
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
              - key: ssh_host_ed25519_key.pub
                path: ssh_host_ed25519_key.pub
---
apiVersion: v1
kind: Service
metadata:
  name: claw-$TENANT_ID-tool
  labels:
    app.kubernetes.io/name: claw-two-sandbox
    app.kubernetes.io/component: tool
    app.kubernetes.io/managed-by: claw-two-sandbox
    claw.openai.com/tenant-id: $TENANT_ID
    claw.openai.com/runtime-id: $RUNTIME_ID
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: claw-two-sandbox
    app.kubernetes.io/component: tool
    claw.openai.com/tenant-id: $TENANT_ID
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-$TENANT_ID-runtime
  labels: &runtimeLabels
    app.kubernetes.io/name: claw-two-sandbox
    app.kubernetes.io/component: runtime
    app.kubernetes.io/managed-by: claw-two-sandbox
    claw.openai.com/tenant-id: $TENANT_ID
    claw.openai.com/runtime-id: $RUNTIME_ID
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claw-two-sandbox
      app.kubernetes.io/component: runtime
      claw.openai.com/tenant-id: $TENANT_ID
  template:
    metadata:
      labels: *runtimeLabels
    spec:
      automountServiceAccountToken: false
      $RUNTIME_RUNTIME_CLASS_LINE
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: $RUNTIME_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: TENANT_ID
              value: $TENANT_ID
            - name: RUNTIME_ID
              value: $RUNTIME_ID
            - name: TOOL_SSH_TARGET
              value: executor@claw-$TENANT_ID-tool:2222
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: $LLM_SECRET_NAME
                  key: openai-base-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: $LLM_SECRET_NAME
                  key: openai-api-key
            - name: OPENCLAW_MODEL
              valueFrom:
                secretKeyRef:
                  name: $LLM_SECRET_NAME
                  key: openclaw-model
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - test -f /state/$TENANT_ID/ready && timeout 2 bash -c "</dev/tcp/claw-$TENANT_ID-tool/2222"
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: "$RUNTIME_CPU_REQUEST"
              memory: "$RUNTIME_MEMORY_REQUEST"
              ephemeral-storage: "$RUNTIME_STORAGE_REQUEST"
            limits:
              cpu: "$RUNTIME_CPU_LIMIT"
              memory: "$RUNTIME_MEMORY_LIMIT"
              ephemeral-storage: "$RUNTIME_STORAGE_LIMIT"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: workspace
              mountPath: /workspace
            - name: home
              mountPath: /home/openclaw
            - name: tmp
              mountPath: /tmp
            - name: ssh-private-key
              mountPath: /var/run/secrets/tool-ssh
              readOnly: true
      volumes:
        - name: state
          emptyDir:
            sizeLimit: "$RUNTIME_STORAGE_LIMIT"
        - name: workspace
          emptyDir:
            sizeLimit: 256Mi
        - name: home
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: ssh-private-key
          secret:
            secretName: $SSH_SECRET_NAME
            defaultMode: 0440
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: ssh_host_ed25519_key.pub
                path: ssh_host_ed25519_key.pub
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claw-$TENANT_ID-default-deny
  labels:
    app.kubernetes.io/name: claw-two-sandbox
    app.kubernetes.io/managed-by: claw-two-sandbox
    claw.openai.com/tenant-id: $TENANT_ID
    claw.openai.com/runtime-id: $RUNTIME_ID
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: claw-two-sandbox
      claw.openai.com/tenant-id: $TENANT_ID
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claw-$TENANT_ID-tool-ingress
  labels:
    app.kubernetes.io/name: claw-two-sandbox
    app.kubernetes.io/managed-by: claw-two-sandbox
    claw.openai.com/tenant-id: $TENANT_ID
    claw.openai.com/runtime-id: $RUNTIME_ID
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: claw-two-sandbox
      app.kubernetes.io/component: tool
      claw.openai.com/tenant-id: $TENANT_ID
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: claw-two-sandbox
              app.kubernetes.io/component: runtime
              claw.openai.com/tenant-id: $TENANT_ID
      ports:
        - port: 2222
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claw-$TENANT_ID-runtime-egress
  labels:
    app.kubernetes.io/name: claw-two-sandbox
    app.kubernetes.io/managed-by: claw-two-sandbox
    claw.openai.com/tenant-id: $TENANT_ID
    claw.openai.com/runtime-id: $RUNTIME_ID
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: claw-two-sandbox
      app.kubernetes.io/component: runtime
      claw.openai.com/tenant-id: $TENANT_ID
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: claw-two-sandbox
              app.kubernetes.io/component: tool
              claw.openai.com/tenant-id: $TENANT_ID
      ports:
        - port: 2222
          protocol: TCP
    - to:
        - ipBlock:
            cidr: $LLM_EGRESS_CIDR
      ports:
        - port: $LLM_EGRESS_PORT
          protocol: TCP
$TOOL_EGRESS_POLICY
