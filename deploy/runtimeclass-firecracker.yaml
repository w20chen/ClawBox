apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc-arm64
  labels:
    app.kubernetes.io/managed-by: clawbox-bootstrap
    clawbox.openai.com/architecture: arm64
    clawbox.openai.com/hypervisor: firecracker
handler: kata-fc-arm64
overhead:
  podFixed:
    cpu: "250m"
    memory: "256Mi"
scheduling:
  nodeSelector:
    kubernetes.io/arch: arm64
    clawbox.openai.com/firecracker-ready: "true"
